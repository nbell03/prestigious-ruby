name: Prestigious Ruby build

on:
  push:
    branches: [prestigious-ruby-dev]
    paths-ignore:
      - "PROJECT_STATUS.md"
      - "docs/**"
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install GBA build dependencies and emulator test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git libpng-dev gcc-arm-none-eabi binutils-arm-none-eabi mgba-sdl xvfb xdotool imagemagick

      - name: Build Pokémon Ruby
        run: make -j2 modern

      - name: Run Prestigious Ruby source regression checks
        run: python3 tools/check_prestigious_features.py

      - name: Check ROM output
        run: |
          set -euo pipefail
          test -s pokeruby.gba
          test "$(stat -c %s pokeruby.gba)" -eq 16777216
          file pokeruby.gba
          sha256sum pokeruby.gba

      - name: Launch ROM in mGBA and inspect rendered screen
        shell: bash
        run: |
          set -euo pipefail
          export SDL_AUDIODRIVER=dummy
          export ROM_PATH="$PWD/pokeruby.gba"
          xvfb-run -a bash -euo pipefail -c '
            mgba -l 15 "$ROM_PATH" > mgba-smoke.log 2>&1 &
            emu_pid=$!
            cleanup() { kill "$emu_pid" 2>/dev/null || true; wait "$emu_pid" 2>/dev/null || true; }
            trap cleanup EXIT
            sleep 10
            echo "--- X11 window tree ---"
            xwininfo -root -tree || true
            echo "--- mGBA process ---"
            ps -p "$emu_pid" -o pid=,stat=,args= || true
            cat mgba-smoke.log
            # Capture the whole virtual display so the test does not depend on
            # a particular title-bar string used by different mGBA builds.
            import -window root mgba-screen.png
            dimensions=$(identify -format "%wx%h" mgba-screen.png)
            colors=$(identify -format "%k" mgba-screen.png)
            echo "Virtual display screenshot: $dimensions; unique colors: $colors"
            # Fail if no emulator UI/game content is rendered (near-solid display).
            if [ "$colors" -lt 32 ]; then
              echo "FAIL: virtual display appears blank or nearly blank"
              exit 1
            fi
            echo "PASS: mGBA remained alive and rendered a nonblank display for 10 seconds."
          '

      - name: Upload ROM and emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prestigious-ruby-emulator-smoke-test
          path: |
            pokeruby.gba
            mgba-smoke.log
            mgba-screen.png
          if-no-files-found: warn
          retention-days: 7
