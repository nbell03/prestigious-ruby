name: Prestigious Ruby build

on:
  push:
    branches: [prestigious-ruby-dev]
    paths-ignore:
      - "PROJECT_STATUS.md"
      - "docs/**"
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install GBA build dependencies and emulator test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git libpng-dev gcc-arm-none-eabi binutils-arm-none-eabi mgba-sdl xvfb xdotool imagemagick

      - name: Build Pokémon Ruby
        run: make -j2 modern

      - name: Run Prestigious Ruby source regression checks
        run: python3 tools/check_prestigious_features.py

      - name: Check ROM output
        run: |
          set -euo pipefail
          test -s pokeruby.gba
          test "$(stat -c %s pokeruby.gba)" -eq 16777216
          file pokeruby.gba
          sha256sum pokeruby.gba

      - name: Launch ROM, advance past intro, and inspect the GBA viewport
        shell: bash
        run: |
          set -euo pipefail
          export SDL_AUDIODRIVER=dummy
          export ROM_PATH="$PWD/pokeruby.gba"
          xvfb-run -a bash -euo pipefail -c '
            mgba -l 15 "$ROM_PATH" > mgba-smoke.log 2>&1 &
            emu_pid=$!
            cleanup() { kill "$emu_pid" 2>/dev/null || true; wait "$emu_pid" 2>/dev/null || true; }
            trap cleanup EXIT
            # Capture the opening sequence before pressing Start.
            sleep 15
            import -window root mgba-before-start.png
            convert mgba-before-start.png -crop 240x160+520+432 +repage mgba-intro-screen.png
            # In mGBA the keyboard Return key maps to GBA Start. This attempts
            # to skip the intro so we can verify more than the initial splash.
            xdotool key --clearmodifiers Return
            sleep 5
            import -window root mgba-screen.png
            convert mgba-screen.png -crop 240x160+520+432 +repage mgba-game-screen.png
            dimensions=$(identify -format "%wx%h" mgba-game-screen.png)
            colors=$(identify -format "%k" mgba-game-screen.png)
            echo "GBA viewport after Start: $dimensions; unique colors: $colors"
            cat mgba-smoke.log
            if [ "$colors" -lt 8 ] || [ "$dimensions" != "240x160" ]; then
              echo "FAIL: GBA viewport is blank or missing"
              exit 1
            fi
            echo "PASS: mGBA rendered the GBA viewport and received a Start-button input."
          '

      - name: Upload ROM and emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prestigious-ruby-emulator-smoke-test
          path: |
            pokeruby.gba
            mgba-smoke.log
            mgba-before-start.png
            mgba-intro-screen.png
            mgba-screen.png
            mgba-game-screen.png
          if-no-files-found: warn
          retention-days: 7
