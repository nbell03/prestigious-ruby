name: Prestigious Ruby build

on:
  push:
    branches: [prestigious-ruby-dev]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install GBA build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git libpng-dev gcc-arm-none-eabi binutils-arm-none-eabi

      - name: Build Pokémon Ruby
        run: make -j2 modern

      - name: Check ROM output
        run: |
          test -s pokeruby.gba
          file pokeruby.gba
          sha256sum pokeruby.gba

      - name: Upload test ROM
        uses: actions/upload-artifact@v4
        with:
          name: prestigious-ruby-test-rom
          path: pokeruby.gba
          if-no-files-found: error
          retention-days: 7
