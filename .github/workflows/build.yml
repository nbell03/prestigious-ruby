name: CI

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GAME_VERSION: RUBY
      GAME_REVISION: 0
      GAME_LANGUAGE: ENGLISH
      DEBUG: 0
      MODERN: 0
      # Prestigious Ruby intentionally changes game data and logic, so the
      # original-ROM byte-for-byte checksum comparison must be disabled.
      COMPARE: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev

      - name: Build and install the supported legacy agbcc compiler
        run: |
          git clone --depth 1 https://github.com/pret/agbcc.git agbcc
          (cd agbcc && ./build.sh && ./install.sh ../)

      - name: Build modified Ruby ROM
        run: |
          make clean
          make -j2 ruby COMPARE=0

      - name: Run Prestigious Ruby source regression checks
        run: python3 tools/check_prestigious_features.py

      - name: Verify generated ROM
        run: |
          set -euo pipefail
          test -s pokeruby.gba
          test "$(stat -c %s pokeruby.gba)" -eq 16777216
          file pokeruby.gba
          sha256sum pokeruby.gba
